<style>
:root{
  --bg:#e8f0fa;--panel:#f6faff;--ink:#0c1d3a;--muted:#4c6488;--line:#86b0dc;
  --glow:#1d78cf;--glow-soft:rgba(29,120,207,.13);--gold:#9a6400;--red:#bf1f2c;--track:#d2e1f2;--ok:#0f8a5f;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#040a18;--panel:#08142c;--ink:#d6eaff;--muted:#7b98c0;--line:#2a64a6;
    --glow:#6fd0ff;--glow-soft:rgba(111,208,255,.11);--gold:#ffc94d;--red:#ff5263;--track:#12244a;--ok:#4fe0a6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#040a18;--panel:#08142c;--ink:#d6eaff;--muted:#7b98c0;--line:#2a64a6;
  --glow:#6fd0ff;--glow-soft:rgba(111,208,255,.11);--gold:#ffc94d;--red:#ff5263;--track:#12244a;--ok:#4fe0a6;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Chakra Petch",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:18px 14px 40px;display:grid;gap:18px}
.brand{max-width:560px;margin:0 auto;padding:22px 16px 2px;display:flex;align-items:center;gap:12px}
.brand svg{flex:none;width:46px;height:46px;color:var(--glow);filter:drop-shadow(0 0 7px var(--glow-soft))}
.brand .wm{font-size:1.55rem;font-weight:700;letter-spacing:.07em;line-height:1.1}
.brand .sub{font-size:.82rem;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

/* The system window: the one distinctive device */
.win{position:relative;background:var(--panel);border:1px solid var(--line);padding:18px 16px 16px;box-shadow:0 0 0 3px var(--glow-soft),0 0 28px var(--glow-soft)}
.win::before,.win::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--glow);pointer-events:none}
.win::before{top:-5px;left:-5px;border-right:0;border-bottom:0}
.win::after{bottom:-5px;right:-5px;border-left:0;border-top:0}
.win-head{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.sigil{flex:none;width:26px;height:26px;display:grid;place-items:center;border:1.5px solid var(--glow);transform:rotate(45deg);color:var(--glow);font-weight:700}
.sigil span{transform:rotate(-45deg);font-size:14px}
.win-head h2{margin:0;font-size:1.15rem;font-weight:600;letter-spacing:.02em}
.win-head .grow{flex:1}
.ghost{background:none;border:1px solid var(--line);padding:4px 10px;font-size:.85rem;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--glow)}

/* Status */
.status-top{display:flex;gap:16px;align-items:flex-end}
.lvl{line-height:.85;font-size:4.2rem;font-weight:700;color:var(--glow);text-shadow:0 0 18px var(--glow-soft)}
.lvl small{display:block;font-size:.8rem;font-weight:500;color:var(--muted);line-height:1.2;margin-bottom:4px;text-shadow:none}
.who{flex:1;min-width:0;padding-bottom:4px}
.who button{background:none;border:0;padding:0;font-size:1.25rem;font-weight:600;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .title{color:var(--muted);font-size:.9rem}
.bar{height:8px;background:var(--track);margin-top:14px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--glow);box-shadow:0 0 10px var(--glow);transition:width .4s ease}
.xpline{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-top:5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 18px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.stat{display:flex;align-items:center;gap:8px;min-height:32px}
.stat .k{flex:1;color:var(--muted)}
.stat .v{font-weight:600;font-variant-numeric:tabular-nums}
.plus{width:28px;height:28px;border:1px solid var(--gold);background:none;color:var(--gold);font-weight:700;line-height:1}
.points{margin-top:10px;color:var(--gold);font-size:.9rem}

/* Quest */
.goal{margin:-6px 0 14px;color:var(--muted);font-size:.92rem}
.timer{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.quests{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.q{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--track)}
.q:last-child{border-bottom:0}
.q .name{font-weight:500;display:flex;align-items:center;gap:8px}
.q .tag{font-size:.72rem;color:var(--muted);border:1px solid var(--track);padding:0 5px}
.q .count{font-variant-numeric:tabular-nums;font-weight:600}
.q .count .of{color:var(--muted);font-weight:400}
.q.done .count{color:var(--ok)}
.q.done .name::before{content:"✓";color:var(--ok);font-weight:700}
.q .mini{grid-column:1/-1;height:3px;background:var(--track);position:relative}
.q .mini i{position:absolute;inset:0 auto 0 0;background:var(--glow)}
.q.done .mini i{background:var(--ok)}
.ctrls{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.ctrls button{background:none;border:1px solid var(--line);padding:5px 12px;min-width:44px;min-height:34px;font-variant-numeric:tabular-nums}
.ctrls button:hover{border-color:var(--glow)}
.ctrls .fin{margin-left:auto;border-color:var(--glow);color:var(--glow)}
.warn{margin:14px 0 0;padding-top:12px;border-top:1px dashed var(--line);font-size:.86rem;color:var(--red)}
.warn.clear{color:var(--ok)}
.empty{color:var(--muted);padding:12px 0}

/* Edit */
.edit{display:grid;gap:10px}
.erow{display:grid;grid-template-columns:1fr 74px;gap:6px;padding:10px;border:1px solid var(--track)}
.erow input,.erow select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:6px 8px;min-width:0;width:100%}
.erow .line2{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr auto;gap:6px}
.erow .del{background:none;border:1px solid var(--red);color:var(--red);padding:0 10px}
.add{border:1px dashed var(--glow);background:none;color:var(--glow);padding:10px}
.fieldlabel{font-size:.75rem;color:var(--muted)}

/* Log */
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.day{aspect-ratio:1;border:1px solid var(--track);background:transparent}
.day.done{background:var(--glow);border-color:var(--glow);box-shadow:0 0 8px var(--glow-soft)}
.day.fail{background:transparent;border-color:var(--red);background-image:linear-gradient(135deg,transparent 45%,var(--red) 45%,var(--red) 55%,transparent 55%)}
.day.today{outline:1px solid var(--ink);outline-offset:1px}
.loglegend{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:6px}
.streaks{display:flex;gap:28px;margin-top:14px}
.streaks b{display:block;font-size:1.8rem;line-height:1;color:var(--glow)}
.streaks span{font-size:.85rem;color:var(--muted)}
.foot{text-align:center;font-size:.8rem;color:var(--muted)}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px}

/* Notice overlay */
.veil{position:fixed;inset:0;display:none;place-items:center;padding:24px;background:rgba(2,6,16,.62);z-index:20}
.veil.on{display:grid}
.veil .win{width:min(420px,100%);text-align:center;padding:26px 20px 20px;transform-origin:center;animation:open .32s cubic-bezier(.2,.9,.3,1)}
@keyframes open{from{transform:scaleY(.04);opacity:.3}to{transform:none;opacity:1}}
.veil h3{margin:6px 0 10px;font-size:1.4rem;font-weight:700}
.veil p{margin:0 0 8px;color:var(--muted)}
.veil .big{font-size:1.05rem;color:var(--ink)}
.veil.gold .win{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,77,.15),0 0 34px rgba(255,201,77,.18)}
.veil.gold .win::before,.veil.gold .win::after{border-color:var(--gold)}
.veil.gold h3{color:var(--gold)}
.veil.red .win{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,82,99,.15),0 0 34px rgba(255,82,99,.18)}
.veil.red .win::before,.veil.red .win::after{border-color:var(--red)}
.veil.red h3{color:var(--red)}
.veil .ok{margin-top:12px;background:none;border:1px solid var(--glow);color:var(--glow);padding:8px 28px}
.veil.gold .ok{border-color:var(--gold);color:var(--gold)}
.veil.red .ok{border-color:var(--red);color:var(--red)}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--glow);padding:8px 14px;font-size:.9rem;box-shadow:0 0 20px var(--glow-soft);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;white-space:nowrap}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.veil .win{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<header class="brand">
  <svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="square">
    <polygon points="24,2 46,24 24,46 2,24" stroke-width="2"/>
    <polygon points="24,8 40,24 24,40 8,24" stroke-width="1" opacity=".45"/>
    <polyline points="16,32 24,25 32,32" stroke-width="2.6" opacity=".4"/>
    <polyline points="16,26 24,19 32,26" stroke-width="2.6" opacity=".7"/>
    <polyline points="16,20 24,13 32,20" stroke-width="2.6"/>
    <circle cx="24" cy="2" r="1.6" fill="currentColor" stroke="none"/>
  </svg>
  <div>
    <div class="wm">Daily Quest</div>
    <div class="sub">Level up in real life</div>
  </div>
</header>
<main id="app"></main>
<div class="veil" id="veil" role="dialog" aria-modal="true"><div class="win" id="veilwin"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
const KEY="daily-quest-v1";
const STATS=[["str","Strength"],["vit","Vitality"],["agi","Agility"],["int","Intelligence"],["sen","Sense"]];
const statName=k=>(STATS.find(s=>s[0]===k)||[k,k])[1];
const TITLES=[[1,"Novice"],[5,"Awakened"],[10,"Steadfast"],[20,"Relentless"],[35,"Unbroken"],[50,"Sovereign of habit"]];
const titleFor=l=>TITLES.filter(t=>l>=t[0]).pop()[1];
const need=l=>100+(l-1)*50;
const QUEST_XP=20, BONUS_XP=50, PENALTY_XP=30;

const fmt=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>fmt(new Date());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid6=()=>Math.random().toString(36).slice(2,9);
const mk=(name,target,unit,stat)=>({id:uid6(),name,target,unit,stat,progress:0,claimed:false});

function defaults(){
  return {v:1,name:"Player",date:today(),level:1,xp:0,points:0,
    stats:{str:10,vit:10,agi:10,int:10,sen:10},streak:0,best:0,rewarded:false,history:{},
    quests:[mk("Push-ups",100,"reps","str"),mk("Sit-ups",100,"reps","vit"),mk("Squats",100,"reps","agi"),mk("Running",10,"km","agi")],
    updatedAt:0};
}
function normalize(r){
  const d=defaults();
  const s=Object.assign(d,r||{});
  s.stats=Object.assign(defaults().stats,s.stats||{});
  s.history=s.history||{};
  s.quests=Array.isArray(s.quests)?s.quests.map(q=>Object.assign({id:uid6(),name:"Quest",target:1,unit:"",stat:"str",progress:0,claimed:false},q)):[];
  return s;
}

let fresh=false;
let S;
try{const raw=localStorage.getItem(KEY);S=raw?normalize(JSON.parse(raw)):null}catch(e){S=null}
if(!S){S=defaults();fresh=true}

let editing=false;
const queue=[];

/* ---------- persistence (saved on this device) ---------- */
function save(){
  S.updatedAt=Date.now(); fresh=false;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
}

/* ---------- game rules ---------- */
function rollover(){
  const t=today();
  if(S.date===t) return;
  if(S.date>t){S.date=t;save();return} // clock moved back
  let failed=0;
  if(!S.rewarded&&S.quests.length){S.history[S.date]="fail";failed++}
  let d=addDays(S.date,1);
  while(d<t&&failed<400){if(S.quests.length){S.history[d]="fail";failed++} d=addDays(d,1)}
  if(failed){
    const lost=Math.min(S.xp,PENALTY_XP);
    S.xp-=lost; const old=S.streak; S.streak=0;
    queue.push({tone:"red",sigil:"!",title:"Daily quest failed",
      lines:[failed>1?`You missed ${failed} days of quests.`:"Yesterday’s quest was left unfinished.",
      `Penalty applied: ${lost} XP lost${old?`, ${old}-day streak broken`:""}.`,
      "A new quest has been issued. Finish it before midnight."]});
  }
  S.date=t; S.rewarded=false;
  S.quests.forEach(q=>{q.progress=0;q.claimed=false});
  const cutoff=addDays(t,-90);
  Object.keys(S.history).forEach(k=>{if(k<cutoff)delete S.history[k]});
  save();
}
function gainXp(n){
  S.xp+=n; let ups=0;
  while(S.xp>=need(S.level)){S.xp-=need(S.level);S.level++;S.points+=3;ups++}
  if(ups){
    queue.push({tone:"gold",sigil:"▲",title:"Level up",
      lines:[`<span class="big">You are now level ${S.level}.</span>`,`+${ups*3} stat points to assign.`,`Title: ${titleFor(S.level)}`]});
  }
}
function claimCheck(q){
  if(!q.claimed&&q.progress>=q.target){
    q.claimed=true; S.stats[q.stat]=(S.stats[q.stat]||0)+1;
    toast(`${q.name} complete: +${QUEST_XP} XP, ${statName(q.stat)} +1`);
    gainXp(QUEST_XP);
  }
}
function allCheck(){
  if(!S.rewarded&&S.quests.length&&S.quests.every(q=>q.claimed)){
    S.rewarded=true; S.history[S.date]="done"; S.streak++; S.best=Math.max(S.best,S.streak);
    queue.unshift({tone:"",sigil:"✓",title:"Daily quest complete",
      lines:["Every task is done for today.",`<span class="big">Reward: +${BONUS_XP} bonus XP</span>`,`Streak: ${S.streak} day${S.streak===1?"":"s"}`]});
    gainXp(BONUS_XP);
  }
}
function bump(id,amt){
  const q=S.quests.find(x=>x.id===id); if(!q) return;
  q.progress=Math.max(0,Math.min(q.target,Math.round((q.progress+amt)*100)/100));
  claimCheck(q); allCheck(); save(); render(); showNext();
}
function finish(id){const q=S.quests.find(x=>x.id===id); if(q) bump(id,q.target-q.progress)}

/* ---------- UI ---------- */
const app=document.getElementById("app");
function stepFor(t){return t>=50?10:t>=10?5:1}
function countdown(){
  const n=new Date(); const m=new Date(n); m.setHours(24,0,0,0);
  let s=Math.max(0,Math.floor((m-n)/1000));
  const h=Math.floor(s/3600); s%=3600; const mi=Math.floor(s/60); s%=60;
  return [h,mi,s].map(x=>String(x).padStart(2,"0")).join(":");
}

function statusWin(){
  const pct=Math.min(100,S.xp/need(S.level)*100);
  return `<section class="win" aria-label="Status">
    <div class="win-head"><div class="sigil"><span>i</span></div><h2 class="grow">Status</h2></div>
    <div class="status-top">
      <div class="lvl"><small>Level</small>${S.level}</div>
      <div class="who">
        <button data-act="rename" aria-label="Rename player">${esc(S.name)}</button>
        <div class="title">Title: ${esc(titleFor(S.level))}</div>
      </div>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${need(S.level)}" aria-valuenow="${S.xp}"><i style="width:${pct}%"></i></div>
    <div class="xpline"><span>${S.xp} / ${need(S.level)} XP</span><span>${need(S.level)-S.xp} to next level</span></div>
    <div class="stats">${STATS.map(([k,n])=>`<div class="stat"><span class="k">${n}</span><span class="v">${S.stats[k]}</span>${S.points>0?`<button class="plus" data-act="stat" data-k="${k}" aria-label="Add a point to ${n}">+</button>`:""}</div>`).join("")}</div>
    ${S.points>0?`<div class="points">${S.points} unassigned point${S.points===1?"":"s"}. Tap + to assign.</div>`:""}
  </section>`;
}

function questWin(){
  const done=S.quests.filter(q=>q.claimed).length;
  let body;
  if(editing){
    body=`<div class="edit">${S.quests.map(q=>`
      <div class="erow" data-id="${q.id}">
        <div><div class="fieldlabel">Task</div><input data-f="name" value="${esc(q.name)}" maxlength="40" aria-label="Task name"></div>
        <div><div class="fieldlabel">Target</div><input data-f="target" type="number" min="1" step="any" inputmode="decimal" value="${q.target}" aria-label="Target"></div>
        <div class="line2">
          <div><div class="fieldlabel">Unit</div><input data-f="unit" value="${esc(q.unit)}" maxlength="12" placeholder="reps, km, min" aria-label="Unit"></div>
          <div><div class="fieldlabel">Trains</div><select data-f="stat" aria-label="Stat trained">${STATS.map(([k,n])=>`<option value="${k}"${q.stat===k?" selected":""}>${n}</option>`).join("")}</select></div>
          <div style="display:flex;align-items:flex-end"><button class="del" data-act="del" data-id="${q.id}" aria-label="Delete ${esc(q.name)}" style="height:36px">Delete</button></div>
        </div>
      </div>`).join("")}
      <button class="add" data-act="add">Add a task</button>
    </div>`;
  }else if(!S.quests.length){
    body=`<p class="empty">No tasks yet. Tap Edit to add today’s quest.</p>`;
  }else{
    body=`<ul class="quests">${S.quests.map(q=>{
      const st=stepFor(q.target), pct=q.progress/q.target*100;
      const single=q.target===1&&!q.unit;
      return `<li class="q${q.claimed?" done":""}">
        <div class="name">${esc(q.name)} <span class="tag">${esc(statName(q.stat))}</span></div>
        <div class="count">${single?(q.claimed?"Done":""):`${q.progress} <span class="of">/ ${q.target}${q.unit?" "+esc(q.unit):""}</span>`}</div>
        <div class="mini"><i style="width:${pct}%"></i></div>
        ${q.claimed?"":`<div class="ctrls">
          ${single?"":`<button data-act="bump" data-id="${q.id}" data-n="-1" aria-label="Minus one">−1</button>
          <button data-act="bump" data-id="${q.id}" data-n="1">+1</button>
          ${st>1?`<button data-act="bump" data-id="${q.id}" data-n="${st}">+${st}</button>`:""}`}
          <button class="fin" data-act="fin" data-id="${q.id}">${single?"Mark done":"Finish"}</button>
        </div>`}
      </li>`}).join("")}</ul>
    <p class="warn${S.rewarded?" clear":""}">${S.rewarded?"Today’s quest is complete. Rest well, a new one arrives at midnight.":`${done} of ${S.quests.length} done. Leaving the quest unfinished at midnight breaks your streak and costs ${PENALTY_XP} XP.`}</p>`;
  }
  return `<section class="win" aria-label="Daily quest">
    <div class="win-head"><div class="sigil"><span>!</span></div><h2 class="grow">Daily quest</h2>
      <button class="ghost" data-act="edit">${editing?"Save":"Edit"}</button></div>
    ${editing?"":`<p class="goal">Train to get stronger. Resets in <span class="timer" id="timer">${countdown()}</span></p>`}
    ${body}
  </section>`;
}

function logWin(){
  const t=today(); const days=[];
  for(let i=13;i>=0;i--){const d=addDays(t,-i);days.push(d)}
  return `<section class="win" aria-label="Record">
    <div class="win-head"><div class="sigil"><span>≡</span></div><h2 class="grow">Record</h2></div>
    <div class="strip">${days.map(d=>{const h=S.history[d];return `<div class="day ${h||""}${d===t?" today":""}" title="${d}: ${h==="done"?"complete":h==="fail"?"failed":d===t?"in progress":"no record"}"></div>`}).join("")}</div>
    <div class="loglegend"><span>14 days ago</span><span>Today</span></div>
    <div class="streaks"><div><b>${S.streak}</b><span>Current streak</span></div><div><b>${S.best}</b><span>Best streak</span></div></div>
  </section>`;
}

function render(){
  app.innerHTML=statusWin()+questWin()+logWin()+`<div class="foot"><button data-act="reset">Reset all progress</button></div>`;
}

app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(a==="bump") bump(b.dataset.id,Number(b.dataset.n));
  else if(a==="fin") finish(b.dataset.id);
  else if(a==="stat"){ if(S.points>0){S.points--;S.stats[b.dataset.k]++;save();render()} }
  else if(a==="edit"){
    if(editing){ S.quests.forEach(q=>{ if(q.progress>q.target) q.progress=q.target; claimCheck(q) }); allCheck(); save(); }
    editing=!editing; render(); showNext();
  }
  else if(a==="add"){S.quests.push(mk("New task",10,"reps","str"));save();render();
    const ins=app.querySelectorAll('.erow input[data-f="name"]'); const last=ins[ins.length-1]; if(last){last.focus();last.select()} }
  else if(a==="del"){S.quests=S.quests.filter(q=>q.id!==b.dataset.id);save();render()}
  else if(a==="rename") rename();
  else if(a==="reset") confirmReset();
});
app.addEventListener("change",e=>{
  const row=e.target.closest(".erow"); if(!row) return;
  const q=S.quests.find(x=>x.id===row.dataset.id); if(!q) return;
  const f=e.target.dataset.f; let v=e.target.value;
  if(f==="target"){v=Math.max(0.1,Number(v)||1); v=Math.round(v*100)/100; e.target.value=v}
  if(f==="name"){v=v.trim()||"Task"}
  q[f]=v; save();
});

/* ---------- notices ---------- */
const veil=document.getElementById("veil"), vw=document.getElementById("veilwin");
let veilOpen=false;
function showNext(){
  if(veilOpen||!queue.length) return;
  const n=queue.shift(); veilOpen=true;
  veil.className="veil on "+(n.tone||"");
  vw.innerHTML=`<div class="sigil" style="margin:0 auto"><span>${n.sigil}</span></div><h3>${n.title}</h3>${n.lines.map(l=>`<p>${l}</p>`).join("")}
    ${n.body||""}<div>${n.buttons||`<button class="ok" data-v="ok">OK</button>`}</div>`;
  const first=vw.querySelector("input,button"); if(first) first.focus();
  vw.onclick=ev=>{const btn=ev.target.closest("button[data-v]"); if(!btn) return; const res=n.onClose?n.onClose(btn.dataset.v,vw):true; if(res!==false) closeVeil()};
}
function closeVeil(){veilOpen=false;veil.className="veil";vw.onclick=null;showNext()}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&veilOpen) closeVeil()});

function rename(){
  queue.unshift({sigil:"i",title:"Player name",lines:["What should the system call you?"],
    body:`<input id="nm" value="${esc(S.name)}" maxlength="24" style="font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:8px;width:100%;margin-top:6px;text-align:center">`,
    buttons:`<button class="ok" data-v="ok">Save name</button>`,
    onClose:(v,el)=>{const x=el.querySelector("#nm").value.trim(); if(x){S.name=x;save();render()} }});
  showNext();
  const nm=document.getElementById("nm"); if(nm){nm.focus();nm.select();nm.addEventListener("keydown",e=>{if(e.key==="Enter"){const x=nm.value.trim(); if(x){S.name=x;save();render()} closeVeil()}})}
}
function confirmReset(){
  queue.unshift({tone:"red",sigil:"!",title:"Reset all progress?",lines:["Your level, stats, streaks and tasks go back to the start. This can’t be undone."],
    buttons:`<button class="ok" data-v="no" style="margin-right:8px">Keep progress</button><button class="ok" data-v="yes">Reset</button>`,
    onClose:v=>{ if(v==="yes"){S=defaults();editing=false;save();render();toast("Progress reset")} }});
  showNext();
}

/* ---------- toast ---------- */
const tEl=document.getElementById("toast"); let tT;
function toast(m){tEl.textContent=m;tEl.classList.add("on");clearTimeout(tT);tT=setTimeout(()=>tEl.classList.remove("on"),2200)}

/* ---------- clock ---------- */
rollover(); render(); showNext();
setInterval(()=>{
  if(S.date!==today()){rollover();render();showNext();return}
  const el=document.getElementById("timer"); if(el) el.textContent=countdown();
},1000);

if(fresh){
  queue.push({sigil:"!",title:"You’ve been chosen as a player",
    lines:["A daily quest will appear every day at midnight.","Finish every task to earn XP, raise your stats and keep your streak.","Leave it unfinished and a penalty follows."],
    buttons:`<button class="ok" data-v="ok">Accept</button>`});
  showNext();
}
})();
</script>
</body>
</html>
